plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    compileSdkVersion rootProject.ext.android.compileSdkVersion
    buildToolsVersion rootProject.ext.android.buildToolsVersion

    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a'  // x86_64 only needed for emulator; Play Store uses AAB
        }
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionCode rootProject.ext.versionControl.versionCode
        versionName rootProject.ext.versionControl.versonName
    }

    // ========== ADD THIS SECTION ==========
    sourceSets {
        main {
            python {
                srcDir "src/main/python"           // Android-specific files
                srcDir "src/main/python/emg_util"  // Submodule (shared library)
            }
        }
    }
    // ======================================

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Load keystore from release.keystore (not in git).
            // Create with: keytool -genkey -v -keystore release.keystore
            //               -alias athlete_emg -keyalg RSA -keysize 2048 -validity 10000
            // Then set env vars or local.properties before bundleRelease:
            //   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
            if (file("../release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        release {
            storeFile     file("../release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias      System.getenv("KEY_ALIAS")         ?: "athlete_emg"
            keyPassword   System.getenv("KEY_PASSWORD")      ?: ""
        }
    }
    namespace 'com.clj.blesample'

    buildFeatures {
        buildConfig = true
    }

    aaptOptions {
        noCompress "so"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    implementation project(':FastBleLib')
}

chaquopy {
    defaultConfig {
        version = '3.10'
        buildPython "/usr/bin/python3.10"
        pip {
            install 'numpy'
            install 'scipy'
        }
    }
}
